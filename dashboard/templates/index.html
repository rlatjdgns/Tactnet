<!DOCTYPE html>
<html>
<head>
    <title>TACTNET Dashboard</title>
    <meta http-equiv="refresh" content="5">
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        h1 { text-align: center; color: #00d4ff; }
        .grid { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .card { background: #16213e; border-radius: 10px; padding: 20px; width: 250px; }
        .card h2 { color: #00d4ff; margin-top: 0; }
        .value { font-size: 1.4em; margin: 8px 0; }
        .label { color: #aaa; font-size: 0.85em; }
        .alert { background: #ff4444; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 20px; }
        .online { color: #00ff88; }
        .offline { color: #ff4444; }
    </style>
</head>
<body>
    <h1>TACTNET Dashboard</h1>
    <div id="alert"></div>
    <div class="grid" id="grid"></div>

    <script>
        function parse(payload) {
            const parts = payload.split('|');
            return {
                temp: parseFloat(parts[0]).toFixed(2),
                hum:  parseFloat(parts[1]).toFixed(2),
                pres: parseFloat(parts[2]).toFixed(2)
            };
        }

        function update() {
            fetch('/data')
                .then(r => r.json())
                .then(data => {
                    const grid = document.getElementById('grid');
                    grid.innerHTML = '';
                    ['node1', 'node2', 'node3'].forEach((node, idx) => {
                        const d = parse(data[node] || '0|0|0');
                        grid.innerHTML += `
                            <div class="card">
                                <h2>Node ${idx + 1}</h2>
                                <div class="label">Temperature</div>
                                <div class="value">${d.temp} °C</div>
                                <div class="label">Humidity</div>
                                <div class="value">${d.hum} %</div>
                                <div class="label">Pressure</div>
                                <div class="value">${d.pres} hPa</div>
                            </div>`;
                    });
                });
        }
        update();
        setInterval(update, 5000);
    </script>
</body>
</html>
